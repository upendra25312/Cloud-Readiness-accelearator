name: Validate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Check markdown files
        run: |
          echo "Checking markdown files..."
          find . -name "*.md" -type f | wc -l
          
      - name: Validate directory structure
        run: |
          echo "Validating directory structure..."
          test -d docs && echo "✓ docs directory exists" || echo "✗ docs directory missing"
          test -d templates && echo "✓ templates directory exists" || echo "✗ templates directory missing"
          test -d guides && echo "✓ guides directory exists" || echo "✗ guides directory missing"
          test -d case-studies && echo "✓ case-studies directory exists" || echo "✗ case-studies directory missing"
          test -d resources && echo "✓ resources directory exists" || echo "✗ resources directory missing"
          test -d examples && echo "✓ examples directory exists" || echo "✗ examples directory missing"
          
      - name: Validate core files
        run: |
          echo "Validating core files..."
          test -f README.md && echo "✓ README.md exists" || echo "✗ README.md missing"
          test -f LICENSE && echo "✓ LICENSE exists" || echo "✗ LICENSE missing"
          test -f CONTRIBUTING.md && echo "✓ CONTRIBUTING.md exists" || echo "✗ CONTRIBUTING.md missing"
          test -f CODE_OF_CONDUCT.md && echo "✓ CODE_OF_CONDUCT.md exists" || echo "✗ CODE_OF_CONDUCT.md missing"
          test -f CHANGELOG.md && echo "✓ CHANGELOG.md exists" || echo "✗ CHANGELOG.md missing"
          test -f ROADMAP.md && echo "✓ ROADMAP.md exists" || echo "✗ ROADMAP.md missing"
          test -f package.json && echo "✓ package.json exists" || echo "✗ package.json missing"
          
      - name: Validate documentation files
        run: |
          echo "Validating documentation files..."
          test -f docs/GETTING_STARTED.md && echo "✓ docs/GETTING_STARTED.md exists" || echo "✗ docs/GETTING_STARTED.md missing"
          test -f docs/METHODOLOGY.md && echo "✓ docs/METHODOLOGY.md exists" || echo "✗ docs/METHODOLOGY.md missing"
          test -f docs/ARCHITECTURE.md && echo "✓ docs/ARCHITECTURE.md exists" || echo "✗ docs/ARCHITECTURE.md missing"
          test -f docs/INTEGRATION_GUIDES.md && echo "✓ docs/INTEGRATION_GUIDES.md exists" || echo "✗ docs/INTEGRATION_GUIDES.md missing"
          test -f docs/CUSTOMIZATION_GUIDES.md && echo "✓ docs/CUSTOMIZATION_GUIDES.md exists" || echo "✗ docs/CUSTOMIZATION_GUIDES.md missing"
          test -f docs/FAQ.md && echo "✓ docs/FAQ.md exists" || echo "✗ docs/FAQ.md missing"
          
      - name: Validate template structure
        run: |
          echo "Validating template structure..."
          test -d templates/discovery && echo "✓ templates/discovery exists" || echo "✗ templates/discovery missing"
          test -d templates/scoring && echo "✓ templates/scoring exists" || echo "✗ templates/scoring missing"
          test -d templates/business-case && echo "✓ templates/business-case exists" || echo "✗ templates/business-case missing"
          test -d templates/risk-compliance && echo "✓ templates/risk-compliance exists" || echo "✗ templates/risk-compliance missing"
          test -d templates/governance && echo "✓ templates/governance exists" || echo "✗ templates/governance missing"
          test -d templates/reporting && echo "✓ templates/reporting exists" || echo "✗ templates/reporting missing"
          
      - name: Validate guides structure
        run: |
          echo "Validating guides structure..."
          test -d guides/phase-guides && echo "✓ guides/phase-guides exists" || echo "✗ guides/phase-guides missing"
          test -d guides/integration-guides && echo "✓ guides/integration-guides exists" || echo "✗ guides/integration-guides missing"
          test -d guides/customization-guides && echo "✓ guides/customization-guides exists" || echo "✗ guides/customization-guides missing"
          test -d guides/quality-assurance && echo "✓ guides/quality-assurance exists" || echo "✗ guides/quality-assurance missing"
          
      - name: Validate JSON files
        run: |
          echo "Validating JSON files..."
          python3 -m json.tool package.json > /dev/null && echo "✓ package.json is valid JSON" || echo "✗ package.json is invalid JSON"
          
      - name: Summary
        run: |
          echo "✅ Validation complete!"
          echo "Repository structure is valid and ready for use."
